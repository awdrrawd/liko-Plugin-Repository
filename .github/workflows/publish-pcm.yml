name: Build and verify repository artifacts

on:
  push:
    branches: [ main ]
    paths:
      - 'src/pcm/**'
      - 'scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/publish-pcm.yml'
      - 'Plugins/**'
      - 'manifest.json'
      - 'external.json'
      - 'meta.json'
      - 'Translation-Tool/index.html'
      - 'PCM_Loader*.user.js'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:pcm
      - name: Commit generated artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          artifacts=(dist/pcm/PCM.js 'Plugins/main/Liko - Plugin Collection Manager.main.user.js' PCM_Loader.user.js PCM_Loader.local.user.js Plugins.json README.md index.html)
          if [[ -n "$(git status --porcelain -- "${artifacts[@]}")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${artifacts[@]}"
            git commit -m "chore: build repository artifacts"
            git push
          else
            echo "Generated artifacts already up to date"
          fi
