name: Build PCM bundle

on:
  push:
    branches: [ main ]
    paths:
      - 'src/pcm/**'
      - 'scripts/build-pcm.mjs'
      - 'scripts/test-downloads.mjs'
      - 'Plugins/main/Liko - Plugin Collection Manager.main.user.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pcm-bundle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: node --test scripts/test-downloads.mjs
      - run: node scripts/test-pcm-dependencies.mjs && node scripts/test-pcm-visibility.cjs
      - run: npm run build:pcm

      - name: Commit bundle
        run: |
          if [[ -n "$(git status --porcelain dist/pcm/PCM.js 'Plugins/main/Liko - Plugin Collection Manager.main.user.js')" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/pcm/PCM.js 'Plugins/main/Liko - Plugin Collection Manager.main.user.js'
            git commit -m "chore: build PCM bundle"
            git push
          else
            echo "PCM bundle already up to date"
          fi
